# ═══════════════════════════════════════════════════════════════
# ECI HRM — Nginx Reverse Proxy Configuration
# ═══════════════════════════════════════════════════════════════
#
# File location:
#   Linux:   /etc/nginx/sites-available/eci-hrm
#   Windows: C:\nginx\conf\conf.d\eci-hrm.conf
#
# After placing, enable with:
#   sudo ln -s /etc/nginx/sites-available/eci-hrm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ═══════════════════════════════════════════════════════════════

upstream eci_hrm_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name hrm.eci.local;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Request Body Size (for file uploads) ──
    client_max_body_size 50M;

    # ── Proxy to Next.js ──
    location / {
        proxy_pass http://eci_hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # ── Static Files (long cache) ──
    location /_next/static/ {
        proxy_pass http://eci_hrm_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /favicon.ico {
        proxy_pass http://eci_hrm_backend;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Deny access to hidden files ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

